substitutions:
  _DOCKER_REGION: europe-west2
  _DOCKER_REPO: "fwmtg-docker-release"
  _IMAGE: census31-fwmt-outcome-service
  _REPO_SUFFIX: fwmtg-maven-release
  _REGION: europe-west2
  _CI_PROJECT_ID: c31-fwmtg-ci-prod

options:
  logging: CLOUD_LOGGING_ONLY
