steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Prepare Maven Auth
    entrypoint: bash
    args:
      - -ceu
      - |
        TOKEN="$(gcloud auth print-access-token)"
        cat > /workspace/settings.xml <<EOF
        <settings>
          <servers>
            <server>
              <id>artifact-registry</id>
              <username>oauth2accesstoken</username>
              <password>$${TOKEN}</password>
            </server>
            <server>
              <id>fwmtg-maven-release</id>
              <username>oauth2accesstoken</username>
              <password>$${TOKEN}</password>
            </server>
            <server>
              <id>fwmtg-maven-snapshot</id>
              <username>oauth2accesstoken</username>
              <password>$${TOKEN}</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>artifact-registry</id>
              <repositories>
                <repository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                  <releases>
                    <enabled>true</enabled>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </repository>
                <repository>
                  <id>fwmtg-maven-release</id>
                  <url>https://${_REGION}-maven.pkg.dev/${PROJECT_ID}/fwmtg-maven-release</url>
                  <releases>
                    <enabled>true</enabled>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </repository>
                <repository>
                  <id>fwmtg-maven-snapshot</id>
                  <url>https://${_REGION}-maven.pkg.dev/${PROJECT_ID}/fwmtg-maven-snapshot</url>
                  <releases>
                    <enabled>false</enabled>
                  </releases>
                  <snapshots>
                    <enabled>true</enabled>
                  </snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                  <releases>
                    <enabled>true</enabled>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>artifact-registry</activeProfile>
          </activeProfiles>
        </settings>
        EOF

  - name: maven:3.9.16-eclipse-temurin-25
    id: Compute Snapshot Version
    entrypoint: bash
    args:
      - -ceu
      - |
        BASE_VERSION="$(sed 's/-Drevision=//' .mvn/maven.config | tr -d '[:space:]')"
        if [[ -z "$${BASE_VERSION}" ]]; then
          echo "ERROR: could not read version from .mvn/maven.config" >&2
          exit 1
        fi
        echo "$${BASE_VERSION}" > /workspace/effective-version.txt

  - name: maven:3.9.16-eclipse-temurin-25
    id: Test
    entrypoint: bash
    args:
      - -ceu
      - |
        EFFECTIVE_VERSION="$(cat /workspace/effective-version.txt)"
        mvn -B -ntp -s /workspace/settings.xml -Drevision="$${EFFECTIVE_VERSION}" clean verify

  - name: gcr.io/cloud-builders/docker
    id: Build Docker Snapshot Image
    entrypoint: bash
    args:
      - -ceu
      - |
        EFFECTIVE_VERSION="$(cat /workspace/effective-version.txt)"
        if [[ "${TRIGGER_NAME}" == *-build ]]; then
          IMAGE_TAG="$${EFFECTIVE_VERSION}"
        else
          BRANCH_SAFE="$$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+##; s#-+$##' | cut -c1-20)"
          IMAGE_TAG="$${BRANCH_SAFE}-$${EFFECTIVE_VERSION}-${SHORT_SHA}"
        fi
        docker build --pull \
          --build-arg jar=$(ls target/*.jar | grep -v original | head -1) \
          -t "${_DOCKER_REGION}-docker.pkg.dev/${PROJECT_ID}/${_DOCKER_REPO}/${_IMAGE}:$${IMAGE_TAG}" \
          .
        echo "$${IMAGE_TAG}" > /workspace/image-tag.txt

  - name: gcr.io/cloud-builders/docker
    id: Push Docker Snapshot Image
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE_TAG="$(cat /workspace/image-tag.txt)"
        docker push "${_DOCKER_REGION}-docker.pkg.dev/${PROJECT_ID}/${_DOCKER_REPO}/${_IMAGE}:$${IMAGE_TAG}"

substitutions:
  _DOCKER_REGION: europe-west2
  _DOCKER_REPO: "fwmtg-docker-snapshot"
  _IMAGE: census31-fwmt-outcome-service
  _REGION: europe-west2
  _PR_NUMBER: ""

options:
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
